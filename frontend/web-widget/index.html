<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spectal Pack - AI Assistant</title>
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>

  <body>
    <!-- Typing Animation Popup -->
    <div class="typing-popup" id="typingPopup">
      <div class="typing-content">
        <div class="company-branding">
          <span class="brand-icon"> </span>
          <span class="typing-text" id="typingText"></span>
          <span class="cursor" id="cursor">|</span>
        </div>
        <p class="typing-subtitle">design . print .brand</p>
      </div>
    </div>

    <!-- Chat Avatar Button -->
    <div class="chat-avatar" id="chatAvatar">
      <img src="avatar1.jpg" alt="Spectal AI Assistant" />
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
      <!-- Chat Header -->
      <div class="chat-header">
        <div class="header-content">
          <div class="avatar"></div>
          <div class="header-info">
            <h2>Spectal Pack AI</h2>
            <p class="status">Online • Ready to help</p>
          </div>
        </div>
        <div class="header-buttons">
          <button class="header-btn menu-btn" id="menuBtn" title="More options">⋮</button>
          <button class="close-btn" id="closeBtn">✕</button>
        </div>
      </div>

      <!-- Dropdown Menu -->
      <div class="dropdown-menu" id="dropdownMenu">
        <button class="dropdown-item" id="refreshChatBtn">
          <span class="dropdown-icon">↻</span>
          <span class="dropdown-text">Refresh Chat</span>
        </button>
        <button class="dropdown-item" id="clearChatBtn">
          <span class="dropdown-icon">🧹</span>
          <span class="dropdown-text">Clear Chat</span>
        </button>
      </div>

      <!-- Chat Messages Area -->
      <div class="chat-messages" id="chatMessages">
        <!-- Welcome Card — appears in message area, collapses when user types -->
        <div class="welcome-card" id="welcomeCard">
          <p class="welcome-card-hint">✨ Quick Actions</p>
          <div class="welcome-card-btns">
            <button class="welcome-cta-btn sample-kit-cta" id="welcomeSampleKitBtn">
              <span class="wc-icon">📦</span>
              <span>Request Sample Kit</span>
            </button>
            <button class="welcome-cta-btn quotation-cta" id="welcomeQuotationBtn">
              <span class="wc-icon">💬</span>
              <span>Get a Quotation</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="chat-input">
        <!-- Quick Action Buttons — hidden by default, appear above input after user types -->
        <div class="quick-action-row hidden" id="quickActionRow">
          <button class="quick-action-btn" id="quickSampleKitBtn" title="Request Sample Kit">
            <span>📦</span><span class="qa-label">Sample Kit</span>
          </button>
          <button class="quick-action-btn" id="quickQuotationBtn" title="Get a Quotation">
            <span>💬</span><span class="qa-label">Get Quote</span>
          </button>
        </div>
        <div class="input-container">
          <input
            type="text"
            id="userInput"
            autocomplete="off"
            placeholder="Type your message here..."
          />
          <button class="send-btn" onclick="sendMessage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ===== SAMPLE KIT FORM PANEL ===== -->
    <div class="form-panel" id="sampleKitPanel">
      <div class="form-panel-header">
        <h3>📦 Request a Sample Kit</h3>
        <button class="form-panel-close" id="closeSampleKitPanel">✕</button>
      </div>
      <div class="form-panel-body">
        <form id="sampleKitForm" onsubmit="submitSampleKit(event)">
          <div class="form-row">
            <input type="text" id="sk-name" placeholder="Your Name *" required maxlength="100" />
            <input type="text" id="sk-company" placeholder="Company Name" maxlength="150" />
          </div>
          <div class="form-row">
            <input type="email" id="sk-email" placeholder="Email Address *" required maxlength="255" />
            <input type="tel" id="sk-phone" placeholder="Phone Number" maxlength="20" />
          </div>
          <div class="form-field">
            <label class="form-label">Products Interested In</label>
            <div class="checkbox-grid">
              <label class="cb-item"><input type="checkbox" name="products" value="Stand-Up Pouches" /> Stand-Up Pouches</label>
              <label class="cb-item"><input type="checkbox" name="products" value="Flat Pouches" /> Flat Pouches</label>
              <label class="cb-item"><input type="checkbox" name="products" value="Sachets" /> Sachets</label>
              <label class="cb-item"><input type="checkbox" name="products" value="Roll Stock" /> Roll Stock</label>
              <label class="cb-item"><input type="checkbox" name="products" value="Labels" /> Labels</label>
              <label class="cb-item"><input type="checkbox" name="products" value="Other" /> Other</label>
            </div>
          </div>
          <div class="form-row">
            <input type="text" id="sk-quantity" placeholder="Approx. Quantity Needed" maxlength="100" />
          </div>
          <textarea id="sk-address" placeholder="Delivery Address" rows="2" maxlength="500"></textarea>
          <div id="sk-error" class="form-error" style="display:none;"></div>
          <button type="submit" class="form-submit-btn" id="sk-submit-btn">
            <span>Send Sample Kit Request</span>
          </button>
        </form>
      </div>
    </div>

    <!-- ===== QUOTATION FORM PANEL ===== -->
    <div class="form-panel" id="quotationPanel">
      <div class="form-panel-header">
        <h3>💬 Request a Quotation</h3>
        <button class="form-panel-close" id="closeQuotationPanel">✕</button>
      </div>
      <div class="form-panel-body">
        <form id="quotationForm" onsubmit="submitQuotation(event)">
          <div class="form-row">
            <input type="text" id="qt-name" placeholder="Your Name *" required maxlength="100" />
            <input type="text" id="qt-company" placeholder="Company Name" maxlength="150" />
          </div>
          <div class="form-row">
            <input type="email" id="qt-email" placeholder="Email Address *" required maxlength="255" />
            <input type="tel" id="qt-phone" placeholder="Phone Number" maxlength="20" />
          </div>
          <div class="form-row">
            <select id="qt-product-type">
              <option value="">Select Product Type</option>
              <option>Stand-Up Pouches</option>
              <option>Flat Pouches</option>
              <option>Sachets</option>
              <option>Roll Stock</option>
              <option>Labels</option>
              <option>Other</option>
            </select>
            <input type="text" id="qt-size" placeholder="Size / Dimensions" maxlength="100" />
          </div>
          <div class="form-row">
            <select id="qt-material">
              <option value="">Material Preference</option>
              <option>PET/PE (Standard)</option>
              <option>Kraft Paper</option>
              <option>Mono-Material (All PE)</option>
              <option>Aluminium Foil Laminate</option>
              <option>Not Sure</option>
            </select>
            <input type="text" id="qt-quantity" placeholder="Quantity Required" maxlength="100" />
          </div>
          <div class="form-row">
            <select id="qt-timeline">
              <option value="">Timeline / Urgency</option>
              <option>ASAP (Rush order)</option>
              <option>Within 2 weeks</option>
              <option>Within 1 month</option>
              <option>Flexible</option>
            </select>
          </div>
          <textarea id="qt-notes" placeholder="Special requirements or notes..." rows="2" maxlength="1000"></textarea>
          <div id="qt-error" class="form-error" style="display:none;"></div>
          <button type="submit" class="form-submit-btn quotation-submit" id="qt-submit-btn">
            <span>Send Quotation Request</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Overlay backdrop for form panels -->
    <div class="form-panel-overlay" id="formPanelOverlay"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js?v=4"></script>
  </body>
</html>
